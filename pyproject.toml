[project]
name = "agents-usage"
version = "0.1.0"
description = "macOS menu bar app for the quota, cost and running tasks of Claude Code, Codex and Grok"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "agents-meter>=0.2.0",
]

[project.scripts]
agents-usage = "agents_usage.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
agents-meter = { git = "https://github.com/iskerwin/agents-meter" }

[tool.pytest.ini_options]
testpaths = ["tests"]
